services:
  # 独立媒体存储节点服务 (Storage Node)
  storage-node:
    image: ${STORAGE_NODE_IMAGE:-ghcr.io/qualvey/mtube/storage-node:latest}
    build:
      context: ../..
      dockerfile: packages/storage-node/Dockerfile
    container_name: streamvip-storage-node-${NODE_ID:-node-01}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${STORAGE_PORT:-3001}:3001"
    volumes:
      - ${STORAGE_DATA_PATH:-/var/storage/uploads}:/app/packages/storage-node/public/uploads
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - NODE_ID=${NODE_ID:-node-01}
      - NODE_NAME=${NODE_NAME:-Storage Node 01}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - storage-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3001/api/v1/storage/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  storage-net:
    driver: bridge
