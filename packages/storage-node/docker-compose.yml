services:
  # 独立媒体存储节点服务 (Storage Node)
  storage-node:
    image: ghcr.io/qualvey/mtube/storage-node:latest
    container_name: streamvip-storage-node
    restart: always
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ${STORAGE_DATA_PATH:-/var/storage/uploads}:/app/public/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NODE_ID=${NODE_ID:-node-01}
      - NODE_NAME=${NODE_NAME:-Storage Node 01}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
