services:
  # 独立媒体存储节点服务 (Storage Node)
  storage-node:
    image: ${STORAGE_NODE_IMAGE:-ghcr.io/qualvey/mtube/storage-node:latest}
    build:
      context: ../..
      dockerfile: packages/storage-node/Dockerfile
    container_name: streamvip-storage-node-${NODE_ID:-node-01}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${STORAGE_BIND_IP:-0.0.0.0}:${STORAGE_PORT:-3001}:3001"
    volumes:
      - ${STORAGE_DATA_PATH:-/var/storage/uploads}:/app/packages/storage-node/public/uploads
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - NODE_ID=${NODE_ID:-node-01}
      - NODE_NAME=${NODE_NAME:-Storage Node 01}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3001}
      - MAIN_SERVER_URL=${MAIN_SERVER_URL:-http://localhost:3000}
      - CLUSTER_SECRET=${CLUSTER_SECRET}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30}
      - IS_DEFAULT=${IS_DEFAULT:-false}
      - ENABLE_DIRECT_UPLOAD=${ENABLE_DIRECT_UPLOAD:-true}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - storage-net

networks:
  storage-net:
    driver: bridge
