# ==============================================================================
# StreamVIP 宿主机外部 Nginx (443 SSL) 生产反向代理配置文件示例
# 放置路径参考: /etc/nginx/conf.d/streamvip.conf
# ==============================================================================

# 1. HTTP 自动 301 重定向至 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com admin.your-domain.com; # 替换为您自己的真实域名

    return 301 https://$host$request_uri;
}

# 2. C端主站 HTTPS (443 SSL) 配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com; # C端主站域名

    # SSL 证书路径配置 (Let's Encrypt 或商业证书)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip 静态资源压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. 转发后端 API 请求至 Docker 内 server 容器 (端口 3000)
    # ⚠️ 防 404 关键点：proxy_pass 必须写 http://127.0.0.1:3000 （末尾绝对不能加斜杠 / ），保证 /api/v1/ 原样传递
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2. 转发 C 端前端静态页面至 Docker 内 client 容器 (端口 5173)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        
        # 传递真实客户端 IP 与 HTTPS 协议标记
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 视频流与大文件上传支持 (最大 500MB)
    client_max_body_size 500M;
}

# 3. B端管理控制台 HTTPS (443 SSL) 配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.your-domain.com; # B端后台独立二级域名 (或使用子路径反代)

    # SSL 证书路径配置
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 转发至 Docker 内 admin 容器 (端口 5174)
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;

        # 传递真实客户端 IP 与 HTTPS 协议标记
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    client_max_body_size 200M;
}
