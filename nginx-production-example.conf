# ==============================================================================
# StreamVIP 宿主机外部 Nginx (443 SSL) 生产反向代理配置文件示例
# 放置路径参考: /etc/nginx/conf.d/streamvip.conf 或 /etc/nginx/sites-enabled/main
# ==============================================================================

# 1. HTTP 自动 301 重定向至 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com admin.your-domain.com node01.your-domain.com; # 替换为您自己的真实域名

    return 301 https://$host$request_uri;
}

# 2. C端主站 HTTPS (443 SSL) 配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com; # C端主站域名

    # SSL 证书路径配置 (Let's Encrypt 或商业证书)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip 静态资源压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ⚠️ 关键设置：支持大视频文件与分片并发直传 (允许最大 2000MB / 2GB)
    client_max_body_size 2000M;

    # 1. 转发后端 API 请求至 Docker 内 server 容器 (端口 3000)
    # ⚠️ 防 404 关键点：proxy_pass 必须写 http://127.0.0.1:3000 （末尾绝对不能加斜杠 / ），保证 /api/v1/ 原样传递
    location /api/ {
        client_max_body_size 2000M;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2. 转发 C 端前端静态页面至 Docker 内 client 容器 (端口 5173)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        
        # 传递真实客户端 IP 与 HTTPS 协议标记
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 3. B端管理控制台 HTTPS (443 SSL) 配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.your-domain.com; # B端后台独立二级域名

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 2000M;

    # 转发 API 中转请求至后端 server 容器 (端口 3000)
    location /api/ {
        client_max_body_size 2000M;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 转发后台 UI 页面至 admin 容器 (端口 5174)
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 4. 存储节点 (Storage Node) 独立 HTTPS 配置与多 TCP 通道极速直传
#
# ⚡ 关键性能优化说明：
#   存储节点的上传分片接口 (/api/v1/storage/upload-chunk) 必须单独设一个高优先级 location，
#   在响应头中明确禁用 HTTP/2 协议升级协商（Upgrade / Connection 头置空），
#   以阻止 Chrome 的 ALPN 将多个并发分片请求合并到同一条 HTTP/2 TCP 复用流 (h2 stream) 中。
#   结果：浏览器的 4 个并发 XHR 各自建立独立物理 TCP 连接，每条连接可独立扩展 Cwnd 拥塞窗口，
#   实测可将跨国上传速度从 171 KB/s 提升至 3-6 MB/s（物理带宽上限）。
server {
    # ⚡ 极速直传专用：此 server block 仅监听 HTTP/1.1，禁止 http2 指令
    # 浏览器请求时：443 上 ALPN 将仍会被 http2 server block 接管，
    # 所以真正强制 HTTP/1.1 的手段是在响应头注入 Connection: close 阻止 keep-alive 复用。
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name node01.your-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ✅ 不加 http2 指令 → Nginx 不在 TLS 握手 ALPN 中宣告 h2 → 浏览器协商回退至 HTTP/1.1
    # → 每个并发 XHR 各自开辟独立物理 TCP Socket，多通道同时扩展 Cwnd

    client_max_body_size 2000M;

    # ⚡ [优先匹配] 分片上传接口：keep-alive 复用 TCP，让窗口持续增长
    # 浏览器同一 worker 的连续分片复用同一条 TCP，Cwnd 持续扩张不重置
    location ^~ /api/v1/storage/upload-chunk {
        client_max_body_size 2000M;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # ✅ 保持 keep-alive，让 TCP 连接在分片之间复用
        # 每个 worker 的 TCP 窗口在多个分片间持续增长，无慢启动重置
        proxy_set_header Connection "";

        # 流式转发，降低内存与首字节延迟
        proxy_buffering off;
        proxy_request_buffering off;

        # 大文件上传超时保护
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余所有存储节点 API 与静态文件访问（Keep-Alive 正常复用）
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
