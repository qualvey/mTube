name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter client build

      - name: Build admin
        run: pnpm --filter admin build

      - name: Server syntax check
        run: find packages/server/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Storage node tests
        run: pnpm --filter storage-node test
        env:
          CLUSTER_SECRET: ci-test-secret-0123456789abcdef
