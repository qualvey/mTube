name: StreamVIP Storage Node Independent CI/CD (Manual)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: '选择需要部署的目标节点环境 (Select target node environment)'
        required: true
        default: 'production-storage-01'
        type: choice
        options:
          - production-storage-01
          - staging-storage

env:
  REGISTRY: ghcr.io
  IMAGE_STORAGE_NODE: ghcr.io/qualvey/mtube/storage-node

jobs:
  # 1. 独立构建并推送 Storage Node 容器镜像至 GHCR
  build-storage-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Storage Node Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/storage-node/Dockerfile
          push: true
          tags: ${{ env.IMAGE_STORAGE_NODE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. 安全部署最新镜像至独立存储节点服务器 (敏感信息全量走 GitHub Secrets)
  deploy-to-storage-vps:
    needs: build-storage-node
    if: "always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Storage VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STORAGE_VPS_HOST }}
          username: ${{ secrets.STORAGE_VPS_USER }}
          key: ${{ secrets.STORAGE_VPS_SSH_KEY }}
          port: ${{ secrets.STORAGE_VPS_PORT || 22 }}
          source: "docker-compose.yml"
          target: ${{ secrets.STORAGE_VPS_TARGET || '/opt/storage_node' }}

      - name: SSH — Deploy Storage Node
        uses: appleboy/ssh-action@v1.0.3
        env: 
          TARGET_DIR: ${{ secrets.STORAGE_VPS_TARGET || '/opt/storage_node' }}

        with:
          host: ${{ secrets.STORAGE_VPS_HOST }}
          username: ${{ secrets.STORAGE_VPS_USER }}
          key: ${{ secrets.STORAGE_VPS_SSH_KEY }}
          port: ${{ secrets.STORAGE_VPS_PORT || 22 }}
          target: ${{ secrets.STORAGE_VPS_TARGET || '/opt/storage_node' }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin:/snap/bin
            cd "$TARGET_DIR"
 
            # ── Fail-closed guard ──
            # CLUSTER_SECRET 必须由 GitHub Secret 提供，无默认回退（避免弱默认值/带引号坏值）。
            if [ -z "${{ secrets.CLUSTER_SECRET }}" ]; then
              echo "❌ ERROR: GitHub Secret 'CLUSTER_SECRET' is not configured. Aborting storage-node deployment (fail-closed)."
              exit 1
            fi

            # 若不存在 .env 文件，由 GitHub Secrets 自动生成
            if [ ! -f .env ]; then
              echo "NODE_ENV=production"                                                        > .env
              echo "STORAGE_PORT=${{ secrets.STORAGE_PORT || 3001 }}"                         >> .env
              echo "CLUSTER_SECRET=${{ secrets.CLUSTER_SECRET }}" >> .env
              echo "STORAGE_ROOT=${{ secrets.STORAGE_ROOT || '/data/videos' }}"               >> .env
              echo "MAIN_SERVER_URL=${{ secrets.MAIN_SERVER_URL || 'http://localhost:3000' }}" >> .env
            fi

            # 存储节点专属配置（幂等追加）
            env_changed=0
            ensure_env() {
              local key="$1" val="$2"
              if ! grep -q "^${key}=" .env 2>/dev/null; then
                echo "${key}=${val}" >> .env
                env_changed=1
              fi
            }
            ensure_env "NODE_ID"       "${{ secrets.STORAGE_NODE_ID || 'node-01' }}"
            ensure_env "NODE_LABEL"    "${{ secrets.STORAGE_NODE_LABEL || '存储节点 01' }}"
            ensure_env "MAX_STORAGE_GB" "${{ secrets.MAX_STORAGE_GB || '500' }}"

            if [ "$env_changed" = "1" ]; then
              echo "⚙️ .env updated, will recreate container..."
            fi

            echo "🚀 Pulling latest storage-node image..."
            docker image prune -af || true
            (docker compose pull storage-node || docker-compose pull storage-node)
            (docker compose up -d storage-node || docker-compose up -d storage-node)
            docker image prune -f || true
            echo "✅ Storage node deployed successfully."
