name: StreamVIP Incremental Modular CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: '选择需要部署的服务模块 (Select service to deploy)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - server
          - client
          - admin
          - storage-node

env:
  REGISTRY: ghcr.io
  IMAGE_SERVER: ghcr.io/qualvey/mtube/server
  IMAGE_CLIENT: ghcr.io/qualvey/mtube/client
  IMAGE_ADMIN: ghcr.io/qualvey/mtube/admin
  IMAGE_STORAGE_NODE: ghcr.io/qualvey/mtube/storage-node

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.set-targets.outputs.server }}
      client: ${{ steps.set-targets.outputs.client }}
      admin: ${{ steps.set-targets.outputs.admin }}
      storage-node: ${{ steps.set-targets.outputs.storage-node }}
      compose: ${{ steps.set-targets.outputs.compose }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 路径精准感知过滤器（精准区分各模块的独立改动）
      - name: Path Filter (Detect Changed Modules)
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'packages/server/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            client:
              - 'packages/client/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            admin:
              - 'packages/admin/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            storage-node:
              - 'packages/storage-node/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            compose:
              - 'docker-compose.yml'
              - 'nginx-production-example.conf'

      # 结合路径检测与手动触发输入确定目标服务
      - name: Determine Target Services
        id: set-targets
        run: |
          TARGET="${{ github.event.inputs.target }}"
          FILTER_SERVER="${{ steps.filter.outputs.server }}"
          FILTER_CLIENT="${{ steps.filter.outputs.client }}"
          FILTER_ADMIN="${{ steps.filter.outputs.admin }}"
          FILTER_STORAGE_NODE="${{ steps.filter.outputs.storage-node }}"
          FILTER_COMPOSE="${{ steps.filter.outputs.compose }}"

          BUILD_SERVER="false"
          BUILD_CLIENT="false"
          BUILD_ADMIN="false"
          BUILD_STORAGE_NODE="false"
          BUILD_COMPOSE="false"

          if [ "$TARGET" == "all" ]; then
            BUILD_SERVER="true"
            BUILD_CLIENT="true"
            BUILD_ADMIN="true"
            BUILD_STORAGE_NODE="true"
          elif [ "$TARGET" == "server" ]; then
            BUILD_SERVER="true"
          elif [ "$TARGET" == "client" ]; then
            BUILD_CLIENT="true"
          elif [ "$TARGET" == "admin" ]; then
            BUILD_ADMIN="true"
          elif [ "$TARGET" == "storage-node" ]; then
            BUILD_STORAGE_NODE="true"
          else
            BUILD_SERVER="$FILTER_SERVER"
            BUILD_CLIENT="$FILTER_CLIENT"
            BUILD_ADMIN="$FILTER_ADMIN"
            BUILD_STORAGE_NODE="$FILTER_STORAGE_NODE"
            BUILD_COMPOSE="$FILTER_COMPOSE"
          fi

          echo "server=$BUILD_SERVER" >> $GITHUB_OUTPUT
          echo "client=$BUILD_CLIENT" >> $GITHUB_OUTPUT
          echo "admin=$BUILD_ADMIN" >> $GITHUB_OUTPUT
          echo "storage-node=$BUILD_STORAGE_NODE" >> $GITHUB_OUTPUT
          echo "compose=$BUILD_COMPOSE" >> $GITHUB_OUTPUT

  # 并行构建任务 1：Server 镜像构建与推送
  build-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_SERVER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 并行构建任务 2：Client 镜像构建与推送
  build-client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/client/Dockerfile
          push: true
          tags: ${{ env.IMAGE_CLIENT }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 并行构建任务 3：Admin 镜像构建与推送
  build-admin:
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Admin Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/admin/Dockerfile
          push: true
          tags: ${{ env.IMAGE_ADMIN }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 并行构建任务 4：Storage Node 镜像构建与推送
  build-storage-node:
    needs: detect-changes
    if: needs.detect-changes.outputs.storage-node == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Storage Node Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/storage-node/Dockerfile
          push: true
          tags: ${{ env.IMAGE_STORAGE_NODE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 汇总部署任务：在所有并行构建完成后执行增量 VPS 部署
  deploy-to-vps:
    needs: [detect-changes, build-server, build-client, build-admin, build-storage-node]
    if: "always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.ref == 'refs/heads/main' && (needs.detect-changes.outputs.server == 'true' || needs.detect-changes.outputs.client == 'true' || needs.detect-changes.outputs.admin == 'true' || needs.detect-changes.outputs.storage-node == 'true' || needs.detect-changes.outputs.compose == 'true')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.yml,nginx-production-example.conf"
          target: "/root/mobile-paywall"

      - name: SSH Connect and Incremental Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}

          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin:/snap/bin
            cd /root/mobile-paywall
            
            SERVICES=""
            if [ "${{ needs.detect-changes.outputs.server }}" == "true" ]; then SERVICES="$SERVICES server"; fi
            if [ "${{ needs.detect-changes.outputs.client }}" == "true" ]; then SERVICES="$SERVICES client"; fi
            if [ "${{ needs.detect-changes.outputs.admin }}" == "true" ]; then SERVICES="$SERVICES admin"; fi
            
            if [ -n "$SERVICES" ]; then
              echo "🚀 Cleaning old unused image caches on low-disk VPS..."
              docker image prune -af || true
              echo "🚀 Target incremental update services: $SERVICES"
              (docker compose pull $SERVICES || docker-compose pull $SERVICES)
              (docker compose up -d $SERVICES || docker-compose up -d $SERVICES)
              docker image prune -f || true
            elif [ "${{ needs.detect-changes.outputs.compose }}" == "true" ]; then
              echo "⚙️ Only docker-compose / configuration changed. Reloading containers..."
              (docker compose up -d || docker-compose up -d)
            else
              echo "✨ No service changes detected. Skipping VPS update."
            fi





