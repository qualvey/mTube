name: StreamVIP Incremental Modular CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: '选择需要部署的服务模块 (Select service to deploy)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - server
          - client
          - admin
          - storage-node

env:
  REGISTRY: ghcr.io
  IMAGE_SERVER: ghcr.io/qualvey/mtube/server
  IMAGE_CLIENT: ghcr.io/qualvey/mtube/client
  IMAGE_ADMIN: ghcr.io/qualvey/mtube/admin
  IMAGE_STORAGE_NODE: ghcr.io/qualvey/mtube/storage-node

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.set-targets.outputs.server }}
      client: ${{ steps.set-targets.outputs.client }}
      admin: ${{ steps.set-targets.outputs.admin }}
      storage-node: ${{ steps.set-targets.outputs.storage-node }}
      compose: ${{ steps.set-targets.outputs.compose }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 路径精准感知过滤器（精准区分各模块的独立改动）
      - name: Path Filter (Detect Changed Modules)
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'packages/server/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            client:
              - 'packages/client/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            admin:
              - 'packages/admin/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            storage-node:
              - 'packages/storage-node/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            compose:
              - 'docker-compose.yml'
              - 'nginx-production-example.conf'

      # 结合路径检测与手动触发输入确定目标服务
      - name: Determine Target Services
        id: set-targets
        run: |
          TARGET="${{ github.event.inputs.target }}"
          FILTER_SERVER="${{ steps.filter.outputs.server }}"
          FILTER_CLIENT="${{ steps.filter.outputs.client }}"
          FILTER_ADMIN="${{ steps.filter.outputs.admin }}"
          FILTER_STORAGE_NODE="${{ steps.filter.outputs.storage-node }}"
          FILTER_COMPOSE="${{ steps.filter.outputs.compose }}"

          BUILD_SERVER="false"
          BUILD_CLIENT="false"
          BUILD_ADMIN="false"
          BUILD_STORAGE_NODE="false"
          BUILD_COMPOSE="false"

          if [ "$TARGET" == "all" ]; then
            BUILD_SERVER="true"
            BUILD_CLIENT="true"
            BUILD_ADMIN="true"
            BUILD_STORAGE_NODE="true"
          elif [ "$TARGET" == "server" ]; then
            BUILD_SERVER="true"
          elif [ "$TARGET" == "client" ]; then
            BUILD_CLIENT="true"
          elif [ "$TARGET" == "admin" ]; then
            BUILD_ADMIN="true"
          elif [ "$TARGET" == "storage-node" ]; then
            BUILD_STORAGE_NODE="true"
          else
            BUILD_SERVER="$FILTER_SERVER"
            BUILD_CLIENT="$FILTER_CLIENT"
            BUILD_ADMIN="$FILTER_ADMIN"
            BUILD_STORAGE_NODE="$FILTER_STORAGE_NODE"
            BUILD_COMPOSE="$FILTER_COMPOSE"
          fi

          echo "server=$BUILD_SERVER" >> $GITHUB_OUTPUT
          echo "client=$BUILD_CLIENT" >> $GITHUB_OUTPUT
          echo "admin=$BUILD_ADMIN" >> $GITHUB_OUTPUT
          echo "storage-node=$BUILD_STORAGE_NODE" >> $GITHUB_OUTPUT
          echo "compose=$BUILD_COMPOSE" >> $GITHUB_OUTPUT

  # 并行构建任务 1：Server 镜像构建与推送
  build-server:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_SERVER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 并行构建任务 2：Client 镜像构建与推送
  build-client:
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/client/Dockerfile
          push: true
          tags: ${{ env.IMAGE_CLIENT }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 并行构建任务 3：Admin 镜像构建与推送
  build-admin:
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Admin Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/admin/Dockerfile
          push: true
          tags: ${{ env.IMAGE_ADMIN }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 并行构建任务 4：Storage Node 镜像构建与推送
  build-storage-node:
    needs: detect-changes
    if: needs.detect-changes.outputs.storage-node == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Storage Node Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/storage-node/Dockerfile
          push: true
          tags: ${{ env.IMAGE_STORAGE_NODE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ─────────────────────────────────────────────────────────────────────────
  # 部署任务 A：主站（server + client + admin）
  # Secrets: VPS_HOST / VPS_USER / VPS_SSH_KEY / VPS_PORT
  # ─────────────────────────────────────────────────────────────────────────
  deploy-main:
    needs: [detect-changes, build-server, build-client, build-admin]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.ref == 'refs/heads/main' &&
      (
        needs.detect-changes.outputs.server  == 'true' ||
        needs.detect-changes.outputs.client  == 'true' ||
        needs.detect-changes.outputs.admin   == 'true' ||
        needs.detect-changes.outputs.compose == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Main VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.yml,nginx-production-example.conf"
          target: "/root/mobile-paywall"

      - name: SSH — Incremental Deploy (Main Site)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}

          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin:/snap/bin
            cd /root/mobile-paywall

            # ── Fail-closed guard ──
            # CLUSTER_SECRET 必须由 GitHub Secret 提供，无默认回退（避免弱默认值/带引号坏值）。
            if [ -z "${{ secrets.CLUSTER_SECRET }}" ]; then
              echo "❌ ERROR: GitHub Secret 'CLUSTER_SECRET' is not configured. Aborting main-server deployment (fail-closed)."
              exit 1
            fi

            # 若不存在 .env 文件，由 GitHub Secrets 自动生成
            if [ ! -f .env ]; then
              echo "NODE_ENV=production"                                              > .env
              echo "SERVER_PORT=3000"                                               >> .env
              echo "CLIENT_PORT=5173"                                               >> .env
              echo "ADMIN_PORT=5174"                                                >> .env
              echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME || 'admin' }}"        >> .env
              echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD || 'admin123' }}"     >> .env
              echo "CLUSTER_SECRET=${{ secrets.CLUSTER_SECRET }}" >> .env
              echo "ENABLE_DIRECT_UPLOAD=${{ secrets.ENABLE_DIRECT_UPLOAD || 'true' }}" >> .env
            fi

            # 支付配置（幂等追加：.env 已存在时也补齐，不覆盖已有值）
            env_changed=0
            ensure_env() {
              local key="$1" val="$2"
              if ! grep -q "^${key}=" .env 2>/dev/null; then
                echo "${key}=${val}" >> .env
                env_changed=1
              fi
            }
            ensure_env "RUIZIF_SECRET"     "${{ secrets.RUIZIF_SECRET }}"
            ensure_env "RUIZIF_NOTIFY_URL" "${{ secrets.RUIZIF_NOTIFY_URL || 'https://91cso.com/api/v1/paywall/notify' }}"
            ensure_env "RUIZIF_CHANNEL"    "${{ secrets.RUIZIF_CHANNEL || '4444' }}"
            ensure_env "RUIZIF_NOTIFY_IPS" "${{ secrets.RUIZIF_NOTIFY_IPS || '***REMOVED***' }}"

            # .env 有新增变量时重启 server
            if [ "$env_changed" = "1" ]; then
              echo "⚙️ .env updated, reloading server container..."
              (docker compose up -d server || docker-compose up -d server) || true
            fi

            SERVICES=""
            if [ "${{ needs.detect-changes.outputs.server }}" == "true" ]; then SERVICES="$SERVICES server"; fi
            if [ "${{ needs.detect-changes.outputs.client }}" == "true" ]; then SERVICES="$SERVICES client"; fi
            if [ "${{ needs.detect-changes.outputs.admin }}"  == "true" ]; then SERVICES="$SERVICES admin";  fi

            if [ -n "$SERVICES" ]; then
              echo "🚀 Cleaning old unused image caches..."
              docker image prune -af || true
              echo "🚀 Target incremental update: $SERVICES"
              (docker compose pull $SERVICES || docker-compose pull $SERVICES)
              (docker compose up -d $SERVICES || docker-compose up -d $SERVICES)
              docker image prune -f || true
            elif [ "${{ needs.detect-changes.outputs.compose }}" == "true" ]; then
              echo "⚙️ Only compose/config changed. Reloading all containers..."
              (docker compose up -d || docker-compose up -d)
            else
              echo "✨ No main-site changes detected. Skipping."
            fi

  # ─────────────────────────────────────────────────────────────────────────
  # 部署任务 B：存储节点（storage-node）
  # 独立机器，独立 Secrets:
  #   STORAGE_VPS_HOST / STORAGE_VPS_USER / STORAGE_VPS_SSH_KEY / STORAGE_VPS_PORT
  # 部署目录: /root/storage-node
  # 只管理 storage-node 服务，不影响主站
  # ─────────────────────────────────────────────────────────────────────────
  deploy-storage-node:
    needs: [detect-changes, build-storage-node]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.storage-node == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Storage VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STORAGE_VPS_HOST }}
          username: ${{ secrets.STORAGE_VPS_USER }}
          key: ${{ secrets.STORAGE_VPS_SSH_KEY }}
          port: ${{ secrets.STORAGE_VPS_PORT || 22 }}
          source: "docker-compose.yml"
          target: ${{ secrets.STORAGE_VPS_TARGET || '/opt/storage_node' }}

      - name: SSH — Deploy Storage Node
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_DIR: ${{ secrets.STORAGE_VPS_TARGET || '/opt/storage_node' }}
        with:
          host: ${{ secrets.STORAGE_VPS_HOST }}
          username: ${{ secrets.STORAGE_VPS_USER }}
          key: ${{ secrets.STORAGE_VPS_SSH_KEY }}
          port: ${{ secrets.STORAGE_VPS_PORT || 22 }}

          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/usr/local/sbin:/usr/sbin:/snap/bin
            cd "$TARGET_DIR"

            # ── Fail-closed guard ──
            # CLUSTER_SECRET 必须由 GitHub Secret 提供，无默认回退（避免弱默认值/带引号坏值）。
            if [ -z "${{ secrets.CLUSTER_SECRET }}" ]; then
              echo "❌ ERROR: GitHub Secret 'CLUSTER_SECRET' is not configured. Aborting storage-node deployment (fail-closed)."
              exit 1
            fi

            # 若不存在 .env 文件，由 GitHub Secrets 自动生成
            if [ ! -f .env ]; then
              echo "NODE_ENV=production"                                                        > .env
              echo "STORAGE_PORT=${{ secrets.STORAGE_PORT || 3001 }}"                         >> .env
              echo "CLUSTER_SECRET=${{ secrets.CLUSTER_SECRET }}" >> .env
              echo "STORAGE_ROOT=${{ secrets.STORAGE_ROOT || '/data/videos' }}"               >> .env
              echo "MAIN_SERVER_URL=${{ secrets.MAIN_SERVER_URL || 'http://localhost:3000' }}" >> .env
            fi

            # 存储节点专属配置（幂等追加）
            env_changed=0
            ensure_env() {
              local key="$1" val="$2"
              if ! grep -q "^${key}=" .env 2>/dev/null; then
                echo "${key}=${val}" >> .env
                env_changed=1
              fi
            }
            ensure_env "NODE_ID"       "${{ secrets.STORAGE_NODE_ID || 'node-01' }}"
            ensure_env "NODE_LABEL"    "${{ secrets.STORAGE_NODE_LABEL || '存储节点 01' }}"
            ensure_env "MAX_STORAGE_GB" "${{ secrets.MAX_STORAGE_GB || '500' }}"

            if [ "$env_changed" = "1" ]; then
              echo "⚙️ .env updated, will recreate container..."
            fi

            echo "🚀 Pulling latest storage-node image..."
            docker image prune -af || true
            (docker compose pull storage-node || docker-compose pull storage-node)
            (docker compose up -d storage-node || docker-compose up -d storage-node)
            docker image prune -f || true
            echo "✅ Storage node deployed successfully."






